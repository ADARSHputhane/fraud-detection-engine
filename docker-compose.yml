services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://fraud:fraud@postgres:5432/fraud
      REDIS_URL: redis://redis:6379/0
      # Edit src/fraud_engine/rules/default_rules.yml on the host: the running services pick
      # the change up within a couple of seconds (hot reload), no rebuild needed.
      RULES_PATH: /app/rules/default_rules.yml
      # Models trained on the host (fraud-engine train --promote) are picked up live.
      MODEL_DIR: /app/models
    volumes: &app-volumes
      - ./src/fraud_engine/rules:/app/rules:ro
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Consumes events:incoming and computes features (and, later, the decision) per event.
  worker:
    build: .
    command: ["fraud-engine", "worker"]
    environment: *app-env
    volumes: *app-volumes
    depends_on: *app-deps
    restart: unless-stopped

  # Analyst dashboard on http://localhost:3000 (talks to the API over the compose network).
  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional: docker compose --profile monitoring up -d, then open http://localhost:9090
  # and query e.g. histogram_quantile(0.95, rate(fraud_end_to_end_seconds_bucket[1m])).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

volumes:
  pgdata:
