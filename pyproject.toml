[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-engine"
version = "0.1.0"
description = "Real-time payment fraud detection engine: rules + ML risk scoring behind a FastAPI service."
authors = [{ name = "Adarsh Puthane", email = "adarshputhane@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "faker>=25.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[project.scripts]
fraud-gen = "fraud_engine.generator.cli:main"
fraud-engine = "fraud_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_engine = ["features/reference/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Explicit if/else often reads better than a ternary for branching logic with comments.
ignore = ["SIM108"]
